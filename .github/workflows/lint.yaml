name: Run Lint

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/**'
      - 'renovate.json'

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Project
        uses: $/.github/actions/setup-project

      - name: Run Lint
        run: |
          git fetch origin dev
          ./gradlew spotlessCheck
