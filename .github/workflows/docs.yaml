name: docs
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref }}-docs
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Project
        uses: $/.github/actions/setup-project

      - name: Generate API documentation
        run: ./gradlew :adam:dokkaGeneratePublicationHtml

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build documentation site
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy-docs:
    name: Publish documentation to GitHub Pages
    # PRs are build-validated only; deploys happen on pushes to master and manual runs
    if: github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
