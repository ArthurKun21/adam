name: Setup Project
description: Sets up the project environment for development.

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7.0.1

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6.4.1

    - uses: actions/setup-java@v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up gradle
      uses: gradle/actions/setup-gradle@v6.4.1
